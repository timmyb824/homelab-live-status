[project]
name = "homelab-live-status"
version = "0.1.0"
description = "Collects homelab state (Traefik services, hosts, nodes) into a normalized status snapshot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.27",
    "respx>=0.22,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_live_status"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
